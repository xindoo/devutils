<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML 格式化工具</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-palenight.min.css">
    <style>
        .CodeMirror {
            border: 1px solid var(--border);
            font-size: 14px;
            flex-grow: 1;
            border-radius: var(--border-radius);
            background: var(--surface);
        }

        .CodeMirror-gutters {
            background: var(--surface-hover);
            border-right: 1px solid var(--border);
        }

        .editor-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .copy-icon {
            position: absolute;
            top: 10px;
            right: 20px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            fill: var(--primary);
            z-index: 10;
            padding: 6px;
            background: var(--surface-hover);
            border-radius: var(--border-radius-sm);
            transition: all var(--transition-fast);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .copy-icon:hover {
            fill: var(--primary-dark);
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
    <script src="../js/tool-theme-helper.js"></script>
</head>
<body>
    <div class="tool-container tool-container-vertical">
        <div class="tool-header">
            <h1>HTML 格式化工具</h1>
            <p>格式化和压缩 HTML 代码，使其更易于阅读或传输。</p>
        </div>
        <div class="tool-controls">
            <button class="tool-button" onclick="formatHtml()">格式化</button>
            <button class="tool-button" onclick="compressHtml()">压缩</button>
        </div>
        <div class="tool-io-section">
            <label class="tool-label" for="html-area">输入/输出</label>
            <div class="editor-container">
                <textarea id="html-area" placeholder="在此处粘贴 HTML..."></textarea>
                <svg class="copy-icon" onclick="copyToClipboard()" viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </div>
        </div>

        <div id="error-output" class="tool-error"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>

    <script>
        const errorOutput = document.getElementById('error-output');
        const textarea = document.getElementById('html-area');

        const editor = CodeMirror.fromTextArea(textarea, {
            lineNumbers: true,
            mode: "xml",
            htmlMode: true,
            theme: "material-palenight",
            matchTags: {bothTags: true},
            autoCloseTags: true,
            lineWrapping: true
        });

        function clearError() {
            errorOutput.textContent = '';
        }

        function displayError(message) {
            errorOutput.textContent = message;
        }

        function formatHtml() {
            clearError();
            try {
                const input = editor.getValue().trim();
                if (!input) return;

                let result = '';
                let indent = '';
                const tab = '    ';
                // Void elements：无闭合标签，不应增加缩进层级
                const voidElements = /^(?:area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i;

                // 拆分标签与文本，容忍引号内出现的 ">"
                const tokens = input.split(/(<!--[\s\S]*?-->|<(?:[^>"']|"[^"]*"|'[^']*')*>)/g).filter(token => token.trim() !== '');

                tokens.forEach((token) => {
                    if (token.startsWith('<!') || token.startsWith('<?')) {
                        // 注释、DOCTYPE 与处理指令：不改变缩进层级
                        result += indent + token.trim() + '\n';
                    } else if (token.startsWith('</')) {
                        indent = indent.slice(tab.length);
                        result += indent + token.trim() + '\n';
                    } else if (token.startsWith('<')) {
                        result += indent + token.trim() + '\n';
                        if (!token.endsWith('/>') && !voidElements.test(token.slice(1))) {
                            indent += tab;
                        }
                    } else {
                        const text = token.trim();
                        if (text) {
                            result += indent + text + '\n';
                        }
                    }
                });

                editor.setValue(result.trim());
            } catch (e) {
                displayError('格式化错误: ' + e.message);
            }
        }

        function compressHtml() {
            clearError();
            try {
                const input = editor.getValue().trim();
                if (!input) return;

                // 先提取空白敏感的 script/style 块，避免内容被折叠
                const protectedBlocks = [];
                let work = input.replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, (match) => {
                    protectedBlocks.push(match);
                    return `\u0000${protectedBlocks.length - 1}\u0000`;
                });

                // Remove whitespace between tags
                work = work.replace(/>\s+</g, '><').trim();
                // Remove unnecessary spaces within tags
                work = work.replace(/\s+/g, ' ').replace(/>\s</g, '><');

                // 恢复受保护的块
                work = work.replace(/\u0000(\d+)\u0000/g, (_, i) => protectedBlocks[Number(i)]);

                editor.setValue(work);
            } catch (e) {
                displayError('压缩错误: ' + e.message);
            }
        }

        let copyTimer = null;
        const copyIcon = document.querySelector('.copy-icon');
        const originalIconHtml = copyIcon.innerHTML;

        function copyToClipboard() {
            const content = editor.getValue();
            if (!content) return;
            navigator.clipboard.writeText(content).then(() => {
                clearTimeout(copyTimer);
                copyIcon.innerHTML = `<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>`;
                copyTimer = setTimeout(() => {
                    copyIcon.innerHTML = originalIconHtml;
                }, 2000);
            }).catch(err => {
                alert('无法复制到剪贴板: ' + err);
            });
        }
    </script>
</body>
</html>
