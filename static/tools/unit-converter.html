<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单位换算</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/tool-theme-helper.js"></script>
    <style>
        .swap-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
        }
        .unit-note {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-top: 6px;
        }
        .conversion-line {
            font-size: 1.05em;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-header">
            <h1>单位换算</h1>
            <p>Unit Converter — 长度 / 重量 / 温度 / 面积 / 体积 / 数据存储 / 速度 / 时间</p>
        </div>

        <div class="tool-section">
            <label for="categorySelect" class="tool-label">类别:</label>
            <select id="categorySelect" class="tool-select"></select>
        </div>

        <div class="tool-section">
            <label for="inputValue" class="tool-label">数值:</label>
            <input type="text" id="inputValue" class="tool-input" placeholder="例如: 1.5" autocomplete="off">
            <div class="unit-note" id="categoryNote"></div>
        </div>

        <div class="tool-section tool-inline-controls">
            <div>
                <label for="fromUnit" class="tool-label">源单位:</label>
                <select id="fromUnit" class="tool-select"></select>
            </div>
            <button id="swapBtn" class="tool-button-sm" title="交换单位">⇄ 交换</button>
            <div>
                <label for="toUnit" class="tool-label">目标单位:</label>
                <select id="toUnit" class="tool-select"></select>
            </div>
        </div>

        <div id="resultBox" class="tool-result">
            <div class="conversion-line" id="resultLine">—</div>
        </div>
        <div id="errorBox" class="tool-error"></div>
    </div>

<script>
    // 线性类别: 换算系数 (目标单位值 = 输入值 * from系数 / to系数, 系数基于基准单位)
    const LINEAR_CATEGORIES = {
        length: {
            name: '长度',
            base: '米',
            units: {
                '千米 (km)': 1000, '米 (m)': 1, '分米 (dm)': 0.1, '厘米 (cm)': 0.01,
                '毫米 (mm)': 0.001, '微米 (µm)': 1e-6, '海里 (nmi)': 1852,
                '英里 (mi)': 1609.344, '码 (yd)': 0.9144, '英尺 (ft)': 0.3048, '英寸 (in)': 0.0254
            }
        },
        weight: {
            name: '重量',
            base: '千克',
            units: {
                '吨 (t)': 1000, '千克 (kg)': 1, '克 (g)': 0.001, '毫克 (mg)': 1e-6,
                '斤': 0.5, '两': 0.05, '磅 (lb)': 0.45359237, '盎司 (oz)': 0.028349523125
            }
        },
        area: {
            name: '面积',
            base: '平方米',
            units: {
                '平方千米 (km²)': 1e6, '公顷 (ha)': 1e4, '公亩 (a)': 100, '平方米 (m²)': 1,
                '平方分米 (dm²)': 0.01, '平方厘米 (cm²)': 1e-4, '亩': 6666.666666666667 / 10,
                '平方英里 (mi²)': 2589988.110336, '平方英尺 (ft²)': 0.09290304
            }
        },
        volume: {
            name: '体积',
            base: '升',
            units: {
                '立方米 (m³)': 1000, '升 (L)': 1, '毫升 (mL)': 0.001,
                '加仑 (美 gal)': 3.785411784, '加仑 (英 gal)': 4.54609,
                '品脱 (美 pt)': 0.473176473, '液体盎司 (美 fl oz)': 0.0295735295625,
                '立方英尺 (ft³)': 28.316846592, '立方英寸 (in³)': 0.016387064
            }
        },
        data: {
            name: '数据存储',
            base: '字节 (Byte)',
            note: 'KB/MB/GB 按 SI 标准 (1 KB = 1000 B); KiB/MiB/GiB 按 IEC 二进制标准 (1 KiB = 1024 B), 两套勿混用。',
            units: {
                '比特 (bit)': 0.125, '字节 (B)': 1,
                'KB': 1e3, 'MB': 1e6, 'GB': 1e9, 'TB': 1e12, 'PB': 1e15,
                'KiB': 1024, 'MiB': 1048576, 'GiB': 1073741824, 'TiB': 1099511627776
            }
        },
        speed: {
            name: '速度',
            base: '米/秒',
            units: {
                '米/秒 (m/s)': 1, '千米/小时 (km/h)': 1 / 3.6,
                '英里/小时 (mph)': 0.44704, '节 (kn)': 1852 / 3600, '英尺/秒 (ft/s)': 0.3048
            }
        },
        time: {
            name: '时间',
            base: '秒',
            units: {
                '年 (365天)': 31536000, '周': 604800, '天': 86400, '小时': 3600,
                '分钟': 60, '秒 (s)': 1, '毫秒 (ms)': 0.001, '微秒 (µs)': 1e-6, '纳秒 (ns)': 1e-9
            }
        }
    };

    // 温度: 非线性, 以摄氏度为中间量
    const TEMPERATURE = {
        name: '温度',
        base: '℃',
        units: {
            '摄氏度 (℃)': {
                toBase: v => v,
                fromBase: v => v
            },
            '华氏度 (℉)': {
                toBase: v => (v - 32) * 5 / 9,
                fromBase: v => v * 9 / 5 + 32
            },
            '开尔文 (K)': {
                toBase: v => v - 273.15,
                fromBase: v => v + 273.15
            }
        }
    };

    const CATEGORIES = Object.assign({ temperature: TEMPERATURE }, LINEAR_CATEGORIES);

    const categorySelect = document.getElementById('categorySelect');
    const inputValue = document.getElementById('inputValue');
    const fromUnit = document.getElementById('fromUnit');
    const toUnit = document.getElementById('toUnit');
    const swapBtn = document.getElementById('swapBtn');
    const resultLine = document.getElementById('resultLine');
    const errorBox = document.getElementById('errorBox');
    const categoryNote = document.getElementById('categoryNote');

    let currentCategory = 'length';

    function formatNumber(x) {
        if (!isFinite(x)) return '—';
        if (x === 0) return '0';
        const abs = Math.abs(x);
        if (abs >= 1e15 || abs < 1e-6) return x.toExponential(6);
        return String(parseFloat(x.toPrecision(10)));
    }

    function populateCategoryOptions() {
        Object.keys(CATEGORIES).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = CATEGORIES[key].name;
            categorySelect.appendChild(opt);
        });
        categorySelect.value = currentCategory;
    }

    function populateUnitOptions() {
        const cat = CATEGORIES[currentCategory];
        fromUnit.textContent = '';
        toUnit.textContent = '';
        const names = Object.keys(cat.units);
        names.forEach(name => {
            const o1 = document.createElement('option');
            o1.value = name;
            o1.textContent = name;
            fromUnit.appendChild(o1);
            const o2 = document.createElement('option');
            o2.value = name;
            o2.textContent = name;
            toUnit.appendChild(o2);
        });
        // 默认选第一与第二个单位
        fromUnit.selectedIndex = 0;
        toUnit.selectedIndex = Math.min(1, names.length - 1);
        categoryNote.textContent = cat.note || ('基准单位: ' + cat.base);
    }

    function convert() {
        errorBox.textContent = '';
        const raw = inputValue.value.trim().replace(/,/g, '');
        const cat = CATEGORIES[currentCategory];
        if (raw === '') {
            resultLine.textContent = '—';
            return;
        }
        const value = Number(raw);
        if (!isFinite(value)) {
            errorBox.textContent = '请输入有效数字。';
            resultLine.textContent = '—';
            return;
        }

        let result;
        if (currentCategory === 'temperature') {
            const from = cat.units[fromUnit.value];
            const to = cat.units[toUnit.value];
            const baseValue = from.toBase(value);
            // 物理下限校验: 低于绝对零度提示
            if (baseValue < -273.15) {
                errorBox.textContent = '提示: 结果低于绝对零度 (-273.15 ℃), 请检查输入。';
            }
            result = to.fromBase(baseValue);
        } else {
            result = value * cat.units[fromUnit.value] / cat.units[toUnit.value];
        }

        resultLine.textContent = formatNumber(value) + ' ' + fromUnit.value + ' = ' + formatNumber(result) + ' ' + toUnit.value;
    }

    categorySelect.addEventListener('change', () => {
        currentCategory = categorySelect.value;
        populateUnitOptions();
        convert();
    });

    fromUnit.addEventListener('change', convert);
    toUnit.addEventListener('change', convert);
    inputValue.addEventListener('input', convert);

    swapBtn.addEventListener('click', () => {
        const tmp = fromUnit.value;
        fromUnit.value = toUnit.value;
        toUnit.value = tmp;
        convert();
    });

    populateCategoryOptions();
    populateUnitOptions();
</script>
</body>
</html>
