<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 转图片</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #image-output {
            margin-top: 8px;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            padding: 8px;
            min-height: 50px;
            display: block;
            background-color: var(--surface-hover);
            border-radius: var(--border-radius-sm);
        }
    </style>
    <script src="../js/tool-theme-helper.js"></script>
</head>
<body>
    <div class="tool-container">
        <div class="tool-header">
            <h1>Base64 转图片</h1>
            <p>将 Base64 编码的字符串转换为图片并显示。</p>
        </div>

        <div class="tool-section">
            <label class="tool-label" for="base64-input">Base64 数据:</label>
            <textarea id="base64-input" class="tool-textarea" rows="8" placeholder="在此处粘贴 Base64 编码的图片数据..."></textarea>
        </div>

        <div class="tool-controls">
            <button onclick="displayImage()" class="tool-button">显示图片</button>
        </div>

        <div id="error-output" class="tool-error"></div>

        <div class="tool-section">
            <label class="tool-label">图片预览:</label>
            <img id="image-output" src="" alt="图片预览">
        </div>
    </div>

    <script>
        const base64Input = document.getElementById('base64-input');
        const imageOutput = document.getElementById('image-output');
        const errorOutput = document.getElementById('error-output');

        function clearError() {
            errorOutput.textContent = '';
        }

        function displayError(message) {
            errorOutput.textContent = message;
            imageOutput.src = '';
        }

        function displayImage() {
            clearError();
            const base64String = base64Input.value.trim();

            if (!base64String) {
                displayError('请输入 Base64 数据。');
                return;
            }

            // 统一去除空白后再校验/嗅探/拼接，避免带换行的 base64 处理不一致
            const clean = base64String.replace(/\s/g, '');

            // 完整 data URI 含 : ; , 字符，无法通过纯 Base64 校验，需先单独处理
            if (clean.startsWith('data:image')) {
                imageOutput.src = clean;
                return;
            }

            if (!/^[A-Za-z0-9+/=]+$/.test(clean)) {
                 displayError('输入内容似乎不是有效的 Base64 编码。');
                 return;
            }

            let mimeType = 'image/png';
            if (clean.startsWith('/9j/')) mimeType = 'image/jpeg';
            else if (clean.startsWith('iVBORw0KGgo')) mimeType = 'image/png';
            else if (clean.startsWith('R0lGODlh')) mimeType = 'image/gif';
            else if (clean.startsWith('PHN2Zy')) mimeType = 'image/svg+xml';

            try {
                imageOutput.src = `data:${mimeType};base64,${clean}`;
                imageOutput.onerror = () => {
                    displayError('无法加载图片，请检查 Base64 数据和格式。');
                };
                 imageOutput.onload = () => {};
            } catch (e) {
                displayError('转换图片时出错: ' + e.message);
            }
        }
    </script>
</body>
</html>
