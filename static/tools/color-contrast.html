<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色对比度检查与渐变生成</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/tool-theme-helper.js"></script>
    <style>
        .contrast-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .contrast-card {
            padding: 12px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border);
            text-align: center;
        }
        .contrast-card .cc-ratio {
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        .contrast-card .cc-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .contrast-card.pass { border-color: #22C55E; background: rgba(34, 197, 94, 0.08); }
        .contrast-card.fail { border-color: #EF4444; background: rgba(239, 68, 68, 0.08); }
        .cc-verdict { font-weight: 700; }
        .contrast-card.pass .cc-verdict { color: #22C55E; }
        .contrast-card.fail .cc-verdict { color: #EF4444; }
        .contrast-preview {
            margin-top: 10px;
            padding: 18px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border);
            line-height: 1.6;
        }
        .gradient-preview {
            height: 120px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border);
            margin-top: 10px;
        }
        .gradient-stops {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .gradient-stops .stop {
            width: 56px;
            height: 40px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border);
            position: relative;
        }
        .gradient-stops .stop span {
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7em;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        .dual-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .dual-input input[type="color"] {
            width: 44px;
            height: 34px;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            background: var(--surface);
            cursor: pointer;
        }
        .dual-input input[type="text"] {
            flex: 1;
            max-width: 120px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            background: var(--background);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-header">
            <h1>颜色对比度检查与渐变生成</h1>
            <p>WCAG 对比度检查 + CSS 渐变生成器 (Contrast Checker & Gradient Generator)</p>
        </div>

        <!-- ============ 对比度检查 ============ -->
        <div class="tool-section">
            <label class="tool-label">前景色 (文字):</label>
            <div class="dual-input">
                <input type="color" id="fg-color" value="#1E293B">
                <input type="text" id="fg-hex" value="#1E293B" spellcheck="false">
            </div>
        </div>
        <div class="tool-section">
            <label class="tool-label">背景色:</label>
            <div class="dual-input">
                <input type="color" id="bg-color" value="#F8FAFC">
                <input type="text" id="bg-hex" value="#F8FAFC" spellcheck="false">
            </div>
        </div>

        <div class="contrast-cards" id="contrast-cards"></div>

        <div class="contrast-preview" id="contrast-preview">
            <div style="font-size: 1.15em; font-weight: 600;">大字号标题文本 (Large Text ≥ 18.66px bold)</div>
            <div style="font-size: 0.95em;">常规正文文本：The quick brown fox jumps over the lazy dog. 中英文混排预览。</div>
            <div style="font-size: 0.8em;">小字号辅助说明文字 (Small Text)。</div>
        </div>

        <div id="contrast-error" class="tool-error"></div>

        <!-- ============ 渐变生成 ============ -->
        <div class="tool-section" style="margin-top: 28px;">
            <label class="tool-label">渐变起止色与角度:</label>
            <div class="tool-inline-controls" style="margin-top: 6px; flex-wrap: wrap; gap: 14px;">
                <div class="dual-input">
                    <input type="color" id="g1-color" value="#3B82F6">
                    <input type="text" id="g1-hex" value="#3B82F6" spellcheck="false">
                </div>
                <div class="dual-input">
                    <input type="color" id="g2-color" value="#EC4899">
                    <input type="text" id="g2-hex" value="#EC4899" spellcheck="false">
                </div>
                <select id="g-type" class="tool-select">
                    <option value="linear" selected>linear 线性</option>
                    <option value="radial">radial 径向</option>
                </select>
                <label class="tool-label" style="margin: 0;">角度: <span id="g-angle-val">90</span>°</label>
                <input type="range" id="g-angle" min="0" max="360" value="90" style="width: 140px;">
            </div>
        </div>

        <div class="gradient-preview" id="gradient-preview"></div>

        <div class="gradient-stops" id="gradient-stops"></div>

        <div class="tool-section">
            <label class="tool-label">CSS 代码:</label>
            <div class="tool-result" id="gradient-css"></div>
            <div class="tool-controls">
                <button onclick="copyGradientCss()" class="tool-button" id="g-copy-btn">复制 CSS</button>
            </div>
        </div>
    </div>

<script>
    // ============ 颜色解析 ============
    // 支持 #rgb / #rrggbb；非法输入返回 null（调用方保持上次有效值）
    function parseHex(hex) {
        const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex.trim());
        if (!m) return null;
        let h = m[1];
        if (h.length === 3) {
            h = h.split('').map(c => c + c).join('');
        }
        return {
            r: parseInt(h.slice(0, 2), 16),
            g: parseInt(h.slice(2, 4), 16),
            b: parseInt(h.slice(4, 6), 16)
        };
    }

    function toHex(rgb) {
        const h = v => Math.round(v).toString(16).padStart(2, '0');
        return '#' + h(rgb.r) + h(rgb.g) + h(rgb.b);
    }

    // WCAG 相对亮度
    function relativeLuminance(rgb) {
        const ch = v => {
            const s = v / 255;
            return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * ch(rgb.r) + 0.7152 * ch(rgb.g) + 0.0722 * ch(rgb.b);
    }

    function contrastRatio(c1, c2) {
        const l1 = relativeLuminance(c1);
        const l2 = relativeLuminance(c2);
        const [hi, lo] = l1 >= l2 ? [l1, l2] : [l2, l1];
        return (hi + 0.05) / (lo + 0.05);
    }

    // ============ 双向绑定（非法输入保持上次有效值） ============
    function bindColorPair(pickerId, hexId, onChange) {
        const picker = document.getElementById(pickerId);
        const hexInput = document.getElementById(hexId);
        picker.addEventListener('input', () => {
            hexInput.value = picker.value.toUpperCase();
            onChange();
        });
        hexInput.addEventListener('input', () => {
            const rgb = parseHex(hexInput.value);
            if (rgb) {
                picker.value = toHex(rgb);
                onChange();
            }
            // 非法输入不触发更新，保持上次有效状态
        });
        hexInput.addEventListener('change', () => {
            const rgb = parseHex(hexInput.value);
            if (rgb) {
                hexInput.value = toHex(rgb);
            } else {
                hexInput.value = picker.value.toUpperCase(); // 失焦时回写有效值
            }
        });
    }

    // ============ 对比度检查 ============
    const CONTRAST_RULES = [
        { label: 'AA 正常文本', threshold: 4.5 },
        { label: 'AAA 正常文本', threshold: 7.0 },
        { label: 'AA 大文本', threshold: 3.0 },
        { label: 'UI 组件/图形', threshold: 3.0 }
    ];

    function renderContrast() {
        const errorDiv = document.getElementById('contrast-error');
        const fg = parseHex(document.getElementById('fg-hex').value);
        const bg = parseHex(document.getElementById('bg-hex').value);

        // 输入非法时（编辑中）保持上一次渲染结果
        if (!fg || !bg) return;

        const ratio = contrastRatio(fg, bg);
        const cardsWrap = document.getElementById('contrast-cards');
        cardsWrap.textContent = '';

        CONTRAST_RULES.forEach(rule => {
            const pass = ratio >= rule.threshold;
            const card = document.createElement('div');
            card.className = 'contrast-card ' + (pass ? 'pass' : 'fail');

            const ratioDiv = document.createElement('div');
            ratioDiv.className = 'cc-ratio';
            ratioDiv.textContent = ratio.toFixed(2) + ':1';

            const verdict = document.createElement('div');
            verdict.className = 'cc-verdict';
            verdict.textContent = pass ? '✓ 通过' : '✗ 不达标';

            const labelDiv = document.createElement('div');
            labelDiv.className = 'cc-label';
            labelDiv.textContent = rule.label + ' (≥' + rule.threshold + ')';

            card.appendChild(ratioDiv);
            card.appendChild(verdict);
            card.appendChild(labelDiv);
            cardsWrap.appendChild(card);
        });

        // 预览区着色
        const preview = document.getElementById('contrast-preview');
        preview.style.color = toHex(fg);
        preview.style.backgroundColor = toHex(bg);
        errorDiv.textContent = '';
    }

    // ============ 渐变生成 ============
    function mixColor(c1, c2, t) {
        return {
            r: c1.r + (c2.r - c1.r) * t,
            g: c1.g + (c2.g - c1.g) * t,
            b: c1.b + (c2.b - c1.b) * t
        };
    }

    function buildGradientCss() {
        const c1 = parseHex(document.getElementById('g1-hex').value) || parseHex(document.getElementById('g1-color').value);
        const c2 = parseHex(document.getElementById('g2-hex').value) || parseHex(document.getElementById('g2-color').value);
        const angle = Math.min(360, Math.max(0, parseInt(document.getElementById('g-angle').value, 10) || 0));
        const type = document.getElementById('g-type').value;
        const h1 = toHex(c1), h2 = toHex(c2);
        return type === 'linear'
            ? 'linear-gradient(' + angle + 'deg, ' + h1 + ', ' + h2 + ')'
            : 'radial-gradient(circle at 50% 50%, ' + h1 + ', ' + h2 + ')';
    }

    function renderGradient() {
        const css = buildGradientCss();
        document.getElementById('gradient-preview').style.background = css;
        document.getElementById('gradient-css').textContent = 'background: ' + css + ';';

        // 中间 5 档过渡色块（10%, 30%, 50%, 70%, 90%）
        const c1 = parseHex(document.getElementById('g1-hex').value) || parseHex(document.getElementById('g1-color').value);
        const c2 = parseHex(document.getElementById('g2-hex').value) || parseHex(document.getElementById('g2-color').value);
        const stopsWrap = document.getElementById('gradient-stops');
        stopsWrap.textContent = '';
        [0.1, 0.3, 0.5, 0.7, 0.9].forEach(t => {
            const stop = document.createElement('div');
            stop.className = 'stop';
            const mixed = toHex(mixColor(c1, c2, t));
            stop.style.backgroundColor = mixed;
            stop.title = mixed;
            const tag = document.createElement('span');
            tag.textContent = mixed;
            stop.appendChild(tag);
            stopsWrap.appendChild(stop);
        });
    }

    function renderAll() {
        renderContrast();
        renderGradient();
    }

    // ============ 复制 ============
    let copyTimer = null;
    function copyGradientCss() {
        const btn = document.getElementById('g-copy-btn');
        const text = document.getElementById('gradient-css').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const original = btn.textContent;
            if (copyTimer) clearTimeout(copyTimer);
            btn.textContent = '已复制 ✓';
            copyTimer = setTimeout(() => { btn.textContent = original; }, 1500);
        }).catch(err => {
            alert('无法复制到剪贴板: ' + err);
        });
    }

    // ============ 绑定 ============
    bindColorPair('fg-color', 'fg-hex', renderContrast);
    bindColorPair('bg-color', 'bg-hex', renderContrast);
    bindColorPair('g1-color', 'g1-hex', renderGradient);
    bindColorPair('g2-color', 'g2-hex', renderGradient);
    document.getElementById('g-type').addEventListener('change', renderGradient);
    document.getElementById('g-angle').addEventListener('input', () => {
        document.getElementById('g-angle-val').textContent = document.getElementById('g-angle').value;
        renderGradient();
    });

    // 初始渲染（脚本位于 body 底部，DOM 已就绪）
    renderAll();
</script>
</body>
</html>
