<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全景图片查看器 (2:1)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        .tool-container {
            height: 100vh !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            max-width: none !important;
        }
        .tool-header {
            padding: 8px 16px !important;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tool-header h1 {
            margin: 0 !important;
            font-size: 16px !important;
            font-weight: 500;
        }
        .tool-section {
            padding: 0 !important;
            display: flex;
            flex-direction: row !important;
            align-items: center;
            gap: 8px;
        }
        .tool-section input[type="file"] {
            font-size: 12px !important;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
        }
        #urlInput {
            flex: 1 1 auto;
            min-width: 160px;
            max-width: 360px;
            width: auto;
            font-size: 12px !important;
            padding: 4px 8px;
        }
        #loadUrlButton {
            font-size: 12px !important;
            padding: 4px 12px;
        }
        #panorama {
            flex: 1 !important;
            width: 100% !important;
            min-height: 0 !important;
        }
    </style>
    <script src="../js/tool-theme-helper.js"></script>
</head>
<body>
    <div class="tool-container">
        <div class="tool-header">
            <h1>全景图片查看器</h1>
            <div class="tool-section">
                <input type="text" id="urlInput" class="tool-input" placeholder="输入全景图片 URL (2:1 等距柱状投影)">
                <button id="loadUrlButton" class="tool-button">加载</button>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div id="panorama"></div>
    </div>

<script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const loadUrlButton = document.getElementById('loadUrlButton');
    let viewer = null;

    function initializeViewer(config, silent) {
        if (viewer) {
            viewer.destroy();
        }
        viewer = pannellum.viewer('panorama', config);
        viewer.on('error', function(message) {
            lastLoadedUrl = null;
            if (silent) {
                console.warn('全景图片自动加载失败:', message);
                return;
            }
            alert('全景图片加载失败：' + message + '\n请检查 URL 是否正确，以及图片是否允许跨域访问（CORS）。');
        });
    }

    const baseConfig = {
        "type": "equirectangular",
        "autoLoad": false,
        "showControls": true,
        "haov": 360,
        "vaov": 180,
        "minPitch": -90,
        "maxPitch": 90,
        "compass": true
    };

    // 使用占位符初始化
    initializeViewer(baseConfig);

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                const newConfig = { ...baseConfig, panorama: imageUrl, autoLoad: true };
                initializeViewer(newConfig);
            }
            reader.readAsDataURL(file);
        }
    });

    let lastLoadedUrl = null;

    function loadFromUrl(silent) {
        const url = urlInput.value.trim();
        if (!url) {
            alert('请输入图片 URL。');
            return;
        }
        if (url === lastLoadedUrl) {
            return;
        }
        lastLoadedUrl = url;
        const newConfig = { ...baseConfig, panorama: url, autoLoad: true };
        initializeViewer(newConfig, silent);
    }

    loadUrlButton.addEventListener('click', () => loadFromUrl(false));

    urlInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loadFromUrl(false);
        }
    });

    // 输入后自动尝试加载：粘贴立即触发，手动输入防抖 800ms
    let urlAutoTimer = null;
    urlInput.addEventListener('input', function(e) {
        clearTimeout(urlAutoTimer);
        const url = urlInput.value.trim();
        if (!url || !(/^(https?:\/\/|data:|blob:)/i.test(url) || /^\S+\.\S+/.test(url))) {
            return;
        }
        const delay = e.inputType === 'insertFromPaste' ? 0 : 800;
        urlAutoTimer = setTimeout(() => loadFromUrl(true), delay);
    });

    // 支持 ?imageUrl= 参数直接加载
    const queryImageUrl = new URLSearchParams(window.location.search).get('imageUrl');
    if (queryImageUrl) {
        urlInput.value = queryImageUrl;
        loadFromUrl();
    }
</script>

</body>
</html>
