<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/tool-theme-helper.js"></script>
    <style>
        .pw-display {
            font-family: SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 18px;
            word-break: break-all;
            line-height: 1.6;
        }
        .pw-strength-bar {
            height: 10px;
            border-radius: 5px;
            background: var(--surface-hover);
            overflow: hidden;
            margin-top: 8px;
        }
        .pw-strength-fill {
            height: 100%;
            width: 0;
            border-radius: 5px;
            transition: width var(--transition-normal), background-color var(--transition-normal);
        }
        .pw-charsets {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
        }
        .pw-charsets label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-primary);
        }
        .pw-batch-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pw-batch-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            background: var(--surface);
        }
        .pw-batch-item span {
            font-family: SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            word-break: break-all;
            flex-grow: 1;
            color: var(--text-primary);
        }
        .pw-copy-btn {
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .pw-copy-btn:hover { color: var(--primary); }
        .pw-copy-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .pw-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pw-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-header">
            <h1>密码生成器</h1>
            <p>基于 crypto.getRandomValues 生成密码学安全的随机密码（Password Generator）。</p>
        </div>

        <div class="tool-section">
            <label for="lengthRange" class="tool-label">密码长度: <strong id="lengthValue">16</strong></label>
            <input type="range" id="lengthRange" class="tool-input" min="4" max="128" value="16" style="width: 100%;">
        </div>

        <div class="tool-section">
            <span class="tool-label">字符集:</span>
            <div class="pw-charsets">
                <label><input type="checkbox" id="useUpper" checked> 大写字母 (A-Z)</label>
                <label><input type="checkbox" id="useLower" checked> 小写字母 (a-z)</label>
                <label><input type="checkbox" id="useDigits" checked> 数字 (0-9)</label>
                <label><input type="checkbox" id="useSymbols" checked> 符号 (!@#$%^&*...)</label>
            </div>
        </div>

        <div class="tool-section">
            <div class="pw-options">
                <label><input type="checkbox" id="excludeConfusable"> 排除易混淆字符 (il1Lo0OI|`'"~,;:.)</label>
                <label><input type="checkbox" id="ensureEachType" checked> 确保每种已选字符集至少包含一个</label>
            </div>
        </div>

        <div class="tool-section">
            <label for="batchCount" class="tool-label">批量生成数量 (1-50):</label>
            <input type="number" id="batchCount" class="tool-input" min="1" max="50" value="1">
        </div>

        <div class="tool-controls">
            <button id="generateBtn" class="tool-button">生成密码</button>
            <button id="copyBtn" class="tool-button">复制密码</button>
        </div>

        <div class="tool-section">
            <label class="tool-label">生成结果:</label>
            <div id="passwordResult" class="tool-result pw-display">点击"生成密码"开始</div>
            <div class="pw-strength-bar"><div id="strengthFill" class="pw-strength-fill"></div></div>
            <div id="strengthText" class="tool-help">强度估算将显示在这里。</div>
        </div>

        <div class="tool-section" id="batchSection" style="display: none;">
            <label class="tool-label">批量结果 (每行一个，可单独复制):</label>
            <div id="batchList" class="pw-batch-list"></div>
        </div>

        <div id="pwError" class="tool-error"></div>
    </div>

<script>
(function () {
    var lengthRange = document.getElementById('lengthRange');
    var lengthValue = document.getElementById('lengthValue');
    var useUpper = document.getElementById('useUpper');
    var useLower = document.getElementById('useLower');
    var useDigits = document.getElementById('useDigits');
    var useSymbols = document.getElementById('useSymbols');
    var excludeConfusable = document.getElementById('excludeConfusable');
    var ensureEachType = document.getElementById('ensureEachType');
    var batchCount = document.getElementById('batchCount');
    var generateBtn = document.getElementById('generateBtn');
    var copyBtn = document.getElementById('copyBtn');
    var passwordResult = document.getElementById('passwordResult');
    var strengthFill = document.getElementById('strengthFill');
    var strengthText = document.getElementById('strengthText');
    var batchSection = document.getElementById('batchSection');
    var batchList = document.getElementById('batchList');
    var pwError = document.getElementById('pwError');

    var CHARSETS = {
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz',
        digits: '0123456789',
        // 不含反引号与引号等易在输入场景出错的字符保留常用安全符号
        symbols: '!@#$%^&*()-_=+[]{};:,<>?/~'
    };
    var CONFUSABLE = 'il1Lo0OI|';

    lengthRange.addEventListener('input', function () {
        lengthValue.textContent = lengthRange.value;
    });

    // 加载时同步一次初始值
    lengthValue.textContent = lengthRange.value;

    function showError(msg) {
        pwError.textContent = msg;
    }

    function clearError() {
        pwError.textContent = '';
    }

    // crypto 安全的均匀随机索引：拒绝采样，避免 Math.random 与取模偏差
    function randomIndex(maxExclusive) {
        var limit = Math.floor(256 / maxExclusive) * maxExclusive;
        var buf = new Uint8Array(1);
        do {
            crypto.getRandomValues(buf);
        } while (buf[0] >= limit);
        return buf[0] % maxExclusive;
    }

    function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = randomIndex(i + 1);
            var tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
        }
        return arr;
    }

    function getSelectedCharsets() {
        var selected = [];
        if (useUpper.checked) selected.push(CHARSETS.upper);
        if (useLower.checked) selected.push(CHARSETS.lower);
        if (useDigits.checked) selected.push(CHARSETS.digits);
        if (useSymbols.checked) selected.push(CHARSETS.symbols);
        return selected;
    }

    function filterConfusable(str) {
        var out = '';
        for (var i = 0; i < str.length; i++) {
            if (CONFUSABLE.indexOf(str[i]) === -1) out += str[i];
        }
        return out;
    }

    function generatePassword(length, charsets) {
        var pool = charsets.join('');
        var result = '';

        if (ensureEachType.checked && length >= charsets.length) {
            // 每类先保证一个，再从合并池随机补齐，最后整体洗牌
            var prefix = [];
            for (var i = 0; i < charsets.length; i++) {
                prefix.push(charsets[i][randomIndex(charsets[i].length)]);
            }
            for (var k = prefix.length; k < length; k++) {
                prefix.push(pool[randomIndex(pool.length)]);
            }
            return shuffleArray(prefix).join('');
        }

        for (var n = 0; n < length; n++) {
            result += pool[randomIndex(pool.length)];
        }
        return result;
    }

    function estimateStrength(length, poolSize) {
        var bits = length * Math.log2(poolSize);
        var level, pct, color;
        if (bits < 36) { level = '弱'; pct = 25; color = '#EF4444'; }
        else if (bits < 60) { level = '中等'; pct = 50; color = '#F59E0B'; }
        else if (bits < 100) { level = '强'; pct = 75; color = '#10B981'; }
        else { level = '极强'; pct = 100; color = '#059669'; }
        return { bits: bits, level: level, pct: pct, color: color };
    }

    function updateStrength(length, poolSize) {
        var est = estimateStrength(length, poolSize);
        strengthFill.style.width = est.pct + '%';
        strengthFill.style.backgroundColor = est.color;
        strengthText.textContent = '熵值约 ' + est.bits.toFixed(1) + ' bits（字符集 ' + poolSize + ' × 长度 ' + length + '），等级: ' + est.level;
    }

    // 复制图标反馈：常量化路径 + 定时器句柄，避免重复点击竞态
    var COPY_ICON = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
    var CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    var copyTimer = null;
    var lastGenerated = '';

    function flashCopied(btn) {
        if (copyTimer) clearTimeout(copyTimer);
        var original = btn.innerHTML;
        btn.innerHTML = CHECK_ICON;
        copyTimer = setTimeout(function () {
            btn.innerHTML = original;
            copyTimer = null;
        }, 1500);
    }

    function copyText(text, btn, onDone) {
        navigator.clipboard.writeText(text).then(function () {
            flashCopied(btn);
            if (onDone) onDone();
        }).catch(function (err) {
            showError('复制失败: ' + err.message);
        });
    }

    generateBtn.addEventListener('click', function () {
        clearError();
        var length = Math.min(128, Math.max(4, parseInt(lengthRange.value, 10) || 16));
        var charsets = getSelectedCharsets().map(function (cs) {
            return excludeConfusable.checked ? filterConfusable(cs) : cs;
        }).filter(function (cs) { return cs.length > 0; });

        if (charsets.length === 0) {
            showError('请至少选择一种字符集。');
            return;
        }
        if (ensureEachType.checked && length < charsets.length) {
            showError('密码长度 (' + length + ') 小于所选字符集数量 (' + charsets.length + ')，无法保证每类至少一个，请增大长度。');
            return;
        }

        var pool = charsets.join('');
        updateStrength(length, pool.length);

        var count = Math.min(50, Math.max(1, parseInt(batchCount.value, 10) || 1));
        var passwords = [];
        for (var i = 0; i < count; i++) {
            passwords.push(generatePassword(length, charsets));
        }

        lastGenerated = passwords[0];
        // 用 textContent 渲染，避免注入
        passwordResult.textContent = passwords[0];

        if (count > 1) {
            batchSection.style.display = 'block';
            batchList.textContent = '';
            passwords.forEach(function (pw) {
                var item = document.createElement('div');
                item.className = 'pw-batch-item';
                var span = document.createElement('span');
                span.textContent = pw;
                var btn = document.createElement('button');
                btn.className = 'pw-copy-btn';
                btn.innerHTML = COPY_ICON;
                btn.title = '复制';
                btn.addEventListener('click', function () {
                    copyText(span.textContent, btn);
                });
                item.appendChild(span);
                item.appendChild(btn);
                batchList.appendChild(item);
            });
        } else {
            batchSection.style.display = 'none';
        }
    });

    copyBtn.addEventListener('click', function () {
        if (!lastGenerated) {
            showError('请先生成密码。');
            return;
        }
        clearError();
        copyText(lastGenerated, copyBtn);
    });
})();
</script>
</body>
</html>
